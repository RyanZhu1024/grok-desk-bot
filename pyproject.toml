[project]
name = "desk-assistant"
version = "0.1.0"
description = "Push-to-talk desk assistant for a Raspberry Pi that talks to a Grok Bot webhook."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "pygame>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
pi = ["vosk>=0.3.45"]

[project.scripts]
desk-assistant = "desk_assistant.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
